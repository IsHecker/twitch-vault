<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cols:34px 120px 100px 120px minmax(0,1fr) 232px 16px;--bg:#0f1117;--panel:#151822;--panel-2:#1c2030;--hover:#181c28;--line:#232838;--line-soft:#1b1f2d;--text:#d9deec;--dim:#8d95aa;--faint:#5c647a;--accent:#a3b0ff;--accent-soft:rgba(163,176,255,.16)}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark;overflow-y:scroll;scrollbar-gutter:stable}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3044;background-clip:padding-box;border:2px solid transparent;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3b4465;background-clip:padding-box}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#2a3044 transparent}}
body{background:var(--bg);color:var(--text);font:14px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding:32px 28px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.tools,.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--panel-2);border-color:#2f3650}
.btn[aria-busy=true]{opacity:.6}
.btn:disabled{opacity:.45;cursor:default}.btn:disabled:hover{background:var(--panel);border-color:var(--line)}
.field{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{background:none;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--text)}
.sw{width:30px;height:18px;border-radius:9px;background:var(--line);border:0;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.sw[aria-checked=true]{background:var(--accent-soft)}
.sw[aria-checked=true]::after{transform:translateX(12px);background:var(--accent)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.search{flex:1;min-width:220px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--dim);display:inline-flex;gap:7px;align-items:center;transition:color .15s,background .15s}
.pill:hover{color:var(--text)}
.pill[aria-pressed=true]{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--panel-2));color:var(--c,var(--text));border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,var(--line))}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.l-Verbose{--c:#6e7790}.l-Debug{--c:#6fb9b0}.l-Information{--c:#7aa9f2}.l-Warning{--c:#e3b86c}.l-Error{--c:#ef8191}.l-Fatal{--c:#e46fb4}
input[type=datetime-local]{color-scheme:dark}
.table{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.bar{position:absolute;top:0;left:0;height:2px;background:var(--accent);opacity:.7;width:0;z-index:1}
.bar.run{animation:fill linear forwards}
@keyframes fill{to{width:100%}}
.cols,.head{display:grid;grid-template-columns:var(--cols);gap:0 14px;align-items:center;padding:0 20px}
.cols{height:38px;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line)}
.cols button{background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:left}
.cols button:hover{color:var(--text)}
.row{position:relative;border-bottom:1px solid var(--line-soft)}
.row:last-child{border:0}
.row.l-Warning,.row.l-Error,.row.l-Fatal{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 6%,transparent),transparent 55%)}
.row.l-Warning .msg,.row.l-Error .msg,.row.l-Fatal .msg{color:color-mix(in srgb,var(--c) 45%,var(--text))}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--c);opacity:.75}
.head{width:100%;min-height:44px;background:none;border:0;text-align:left;cursor:pointer;transition:background .15s}
.head:hover,.row.open .head{background:color-mix(in srgb,var(--c) 8%,var(--hover))}
.lvl{display:inline-flex;gap:7px;align-items:center;justify-self:start;padding:2px 11px 2px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:500;font-size:13px}
.time,.msg,.src,pre,.props{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12.5px}
.time{display:contents;color:var(--dim);white-space:nowrap}.d{color:var(--dim)}.time b{color:#e6e9f5;font-weight:500}.time i{font-style:normal;color:var(--faint)}.time em{font-style:normal;color:var(--accent);font-size:11px}
.msg,.src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{color:var(--sc,var(--faint));justify-self:start;max-width:100%;padding:1px 9px;border-radius:6px;background:color-mix(in srgb,var(--sc,var(--faint)) 13%,transparent);font-size:12px}
.no{font:12px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--faint);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--faint);transition:transform .25s}
.row.open .chev{transform:rotate(90deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.row.open .body{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.details{padding:6px 18px 18px;display:grid;gap:14px;background:color-mix(in srgb,var(--c) 5%,var(--hover))}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:320px;overflow:auto;unicode-bidi:plaintext}
.props dd pre{max-height:140px}
pre.err{color:#c8a3ab;border-color:#4a2b33}
pre.long{color:var(--dim)}
.sec.x{color:#ef8191}
.ft{color:var(--faint)}.pk{color:#8fa0d6}.pn{color:#5c647a}
.sec{color:var(--dim);font-size:12px;margin-bottom:6px}
.props{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
.props dt{color:#8fa0d6}.props dd{word-break:break-word;min-width:0;unicode-bidi:plaintext}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--faint);font-size:12px}
.note{padding:44px 20px;text-align:center;color:var(--dim)}
.note .btn{margin-top:14px}
.banner{padding:10px 18px;color:#f2a3ae;background:rgba(239,129,145,.08);border-bottom:1px solid var(--line);font-size:13px}
.skel{height:44px;border-bottom:1px solid var(--line-soft);background:linear-gradient(90deg,transparent,rgba(255,255,255,.035),transparent) 0 0/200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
#rows{transition:opacity .2s}#rows.busy{opacity:.55}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--dim);font-size:13px}
.pages{display:flex;gap:4px;align-items:center}
.pages button{min-width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;color:var(--dim)}
.pages button:hover:not(:disabled){background:var(--panel);color:var(--text)}
.pages button[aria-current=page]{background:var(--panel-2);border-color:var(--line);color:var(--text)}
.pages button:disabled{opacity:.35;cursor:default}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(460px,92vw);margin:auto}
dialog::backdrop{background:rgba(5,6,10,.65)}
dialog h2{font-size:16px;margin-bottom:16px}
.fld{display:grid;gap:6px;margin-bottom:14px}.fld label{color:var(--dim);font-size:12px}.fld.inline{display:flex;align-items:center;justify-content:space-between}.fld.inline label{font-size:14px;color:var(--text)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(min-width:837px){html{zoom:1.1}}
@media(max-width:1298px){:root{--cols:34px 120px 100px 120px minmax(0,1fr) 170px 16px}}
@media(max-width:760px){.cols{display:none}.head{grid-template-columns:auto auto 1fr 16px;gap:2px 12px;padding:10px 16px}.msg{grid-column:1/-1;grid-row:2}.src{display:none}.chev{grid-column:4;grid-row:1}.time{display:block;text-align:right}.d{margin-right:8px}.no{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Logs</h1><p class="sub" id="sub">Loading…</p></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Time zone"><button data-tz="egypt">Egypt</button><button data-tz="utc">UTC</button></div>
      <div class="btn" style="cursor:default">Auto-refresh <button class="sw" id="auto" role="switch" aria-checked="false" aria-label="Auto-refresh"></button>
        <select id="every" class="field" style="padding:2px 6px" aria-label="Refresh interval"><option value="5">5s</option><option value="10">10s</option><option value="30">30s</option><option value="60">60s</option></select></div>
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="copyAll" disabled>Copy JSON</button>
      <button class="btn" id="cfg">Settings</button>
    </div>
  </header>

  <div class="filters">
    <div class="frow"><input id="q" class="field search" type="search" placeholder="Search messages and properties" aria-label="Search"><div class="pills" id="pills"></div></div>
    <div class="frow">
      <input id="from" class="field" type="datetime-local" aria-label="From"><input id="to" class="field" type="datetime-local" aria-label="To">
      <button class="btn" data-h="1">Last hour</button><button class="btn" data-h="24">24 hours</button><button class="btn" data-h="168">7 days</button><button class="btn" id="clear">Clear filters</button>
    </div>
  </div>

  <div class="table">
    <div class="bar" id="bar"></div>
    <div class="cols"><span>#</span><span>Level</span><button id="sortBtn" aria-label="Toggle sort order">Date <span id="arrow">↓</span></button><span>Time</span><span>Message</span><span>Source</span><span></span></div>
    <div id="rows"></div>
  </div>
  <div class="pager" id="pager"></div>
</div>

<dialog id="dlg">
  <h2>Settings</h2>
  <div class="fld"><label for="url">Endpoint</label><input id="url" class="field" spellcheck="false"></div>
  <div class="fld"><label for="key">API key</label><input id="key" class="field" type="password" spellcheck="false" autocomplete="off"></div>
  <div class="fld inline"><label for="multi">Allow multiple expanded logs</label><button class="sw" id="multi" role="switch" aria-checked="false"></button></div>
  <div class="acts"><button class="btn" id="reset">Reset to defaults</button><button class="btn" id="close">Cancel</button><button class="btn" id="save" style="border-color:var(--accent)">Save</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const defaultUrl = (typeof window !== 'undefined' && window.location.origin && window.location.origin.startsWith('http'))
      ? window.location.origin + '/serilog-api/api/logs'
      : 'https://stream-vault.runasp.net/serilog-api/api/logs';
    const D = { url: defaultUrl, key: 'SQLite.ununsed.Logs' };
const LV=['Verbose','Debug','Information','Warning','Error','Fatal'];
const el=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem('lv.'+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('lv.'+k,JSON.stringify(v))}catch{}}};
const S={page:1,count:ls.get('count',25),level:'',start:'',end:'',search:'',sort:'Desc',tz:ls.get('tz','egypt')==='utc'?'utc':'egypt',off:72e5,auto:false,every:ls.get('every',10),url:ls.get('url',D.url),key:ls.get('key',D.key),data:null,err:null,loading:false,multi:ls.get('multi',false)===true,open:new Set()};
let seq=0,timer,deb;

const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=Math.imul(31,h)+s.charCodeAt(i)|0;return h.toString(36)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseEg=s=>{const m=typeof s==='string'&&s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{1,2}):(\d{2}):(\d{2})(?:\.(\d+))?\s*([AP]M)$/i);if(!m)return null;const ap=m[8].toUpperCase(),h=(+m[4]%12)+(ap==='PM'?12:0),ms=+(m[7]||'0').padEnd(3,'0').slice(0,3);return{m,ap,ms,wall:Date.UTC(+m[1],m[2]-1,+m[3],h,+m[5],+m[6],ms)}};
const toISO=v=>{if(!v)return'';const t=Date.parse(v+':00Z');return isNaN(t)?'':new Date(S.tz==='utc'?t:t-S.off).toISOString()};
const toInp=d=>new Date(d.getTime()+(S.tz==='utc'?0:S.off)).toISOString().slice(0,16);
function fmtTime(l,P){
  let date,time,ms,ap;const e=S.tz==='egypt'&&parseEg(P&&P.EgyptTime);
  if(e){const m=e.m;date=new Date(Date.UTC(+m[1],m[2]-1,+m[3])).toLocaleDateString('en-US',{timeZone:'UTC',month:'short',day:'numeric',year:'numeric'});time=`${m[4].padStart(2,'0')}:${m[5]}:${m[6]}`;ms=String(e.ms).padStart(3,'0');ap=e.ap}
  else{const d=new Date(l.timestamp);if(isNaN(d))return `<span class="time"><span class="d">${esc(l.timestamp)}</span><span class="t"></span></span>`;const z=S.tz==='utc'?'UTC':'Africa/Cairo';date=d.toLocaleDateString('en-US',{timeZone:z,month:'short',day:'numeric',year:'numeric'});const t=d.toLocaleTimeString('en-US',{timeZone:z,hour12:true,hour:'2-digit',minute:'2-digit',second:'2-digit'});time=t.slice(0,-3);ap=t.slice(-2);ms=String(d.getUTCMilliseconds()).padStart(3,'0')}
  return `<span class="time"><span class="d">${date}</span><span class="t"><b>${time}</b><i>.${ms}</i> <em>${ap}</em></span></span>`}
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1400)}
async function copy(t,m='Copied'){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast(m)}

const KC={Channel:'#f08fc0',StreamId:'#6fd0e0',RequestId:'#6fb9b0',RequestPath:'#7aa9f2',Title:'#f2d49b',EgyptTime:'#b9a4f5',Duration:'#f0b27a',Timeout:'#f0b27a',Remaining:'#f0b27a',Instance:'#7fd6b0',database:'#d6a5f0',server:'#7ab8f5',contextType:'#e0b0ff',Name:'#9fd8a8'};
const srcColor=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 62% 74%)`};
const tok=(t,c)=>`<span style="color:${c}">${esc(t)}</span>`;
function vv(v,key){
  if(v===null)return tok('null','#6e7790');
  if(typeof v==='number')return tok(v,KC[key]||'#f0b27a');
  if(typeof v==='boolean')return tok(v,'#c69bf0');
  if(typeof v==='object')return `<span class="pn">{</span> `+Object.entries(v).map(([k,x])=>`<span class="pk">${esc(k)}</span><span class="pn">:</span> ${vv(x,k)}`).join('<span class="pn">, </span>')+` <span class="pn">}</span>`;
  const s=String(v);
  if(key==='SourceContext'){const i=s.lastIndexOf('.');return `<span class="ft">${esc(s.slice(0,i+1))}</span>${tok(s.slice(i+1),srcColor(s.slice(i+1)))}`}
  if(s.length>160)return `<pre class="long">${esc(s)}</pre>`;
  return tok(s,KC[key]||'#9fd8a8');
}
const plainMsg=t=>String(t).split(/("[^"\n]{1,80}"|\b\d+(?::\d+)+(?:\.\d+)?\b|\b\d+\b)/g).map((p,i)=>i%2?tok(p,p[0]==='"'?'#9fd8a8':'#f0b27a'):esc(p)).join('');
function msgHtml(t,P){
  t=String(t??'');const c=[];
  if(P&&typeof P==='object')for(const[k,v]of Object.entries(P)){
    if(v===null||typeof v==='object'||k==='EgyptTime')continue;const s=String(v);if(!s||s.length>120)continue;
    const col=KC[k]||(typeof v==='number'?'#f0b27a':typeof v==='boolean'?'#c69bf0':'#9fd8a8');
    for(const q of[1,0]){const n=q?'"'+s+'"':s;let i=-1;while((i=t.indexOf(n,i+1))>=0){
      if(!q){const a=t[i-1]||'',b=t[i+s.length]||'',w=/\w/;
        if((w.test(s[0])&&w.test(a))||(w.test(s[s.length-1])&&w.test(b)))continue;
        if(/^\d+$/.test(s)&&(/[:.-]/.test(a)||/[:-]/.test(b)||(b==='.'&&/\d/.test(t[i+s.length+1]||''))))continue}
      c.push({i,e:i+n.length,s,col})}}}
  c.sort((x,y)=>x.i-y.i||(y.e-y.i)-(x.e-x.i));
  let out='',p=0;for(const m of c){if(m.i<p)continue;out+=plainMsg(t.slice(p,m.i))+tok(m.s,m.col);p=m.e}
  return out+plainMsg(t.slice(p));
}
const logObj=l=>{let P=l.properties;try{P=JSON.parse(P)}catch{}return{timestamp:l.timestamp,level:l.level,message:l.message,exception:l.exception,properties:P}};
function setOpen(r,o){r.classList.toggle('open',o);r.querySelector('.head').setAttribute('aria-expanded',o);o?S.open.add(r.dataset.k):S.open.delete(r.dataset.k)}
const excHtml=t=>String(t).split(/\r?\n/).map(line=>{
  const a=line.match(/^(\s*)at (.+?)(?: in (.+?):line (\d+))?\s*$/);
  if(a)return `${esc(a[1])}<span class="ft">at</span> ${tok(a[2],'#7aa9f2')}`+(a[3]?` <span class="ft">in</span> ${tok(a[3],'#6fb9b0')}<span class="ft">:line</span> ${tok(a[4],'#f0b27a')}`:'');
  const e=line.match(/^(\s*(?:--->\s*)?)([\w.`+]+(?:Exception|Error))(.*)$/);
  if(e)return `${esc(e[1])}<span style="color:#f2a3ae;font-weight:500">${esc(e[2])}</span>${esc(e[3])}`;
  return esc(line)}).join('\n');
async function load(silent){
  const my=++seq;S.loading=true;S.err=null;
  el('refresh').setAttribute('aria-busy','true');render();
  const p=new URLSearchParams({page:S.page,count:S.count,sortBy:S.sort,sortOn:'Timestamp',key:S.key});
  const a=toISO(S.start),b=toISO(S.end);
  if(S.level)p.set('level',S.level);if(a)p.set('startDate',a);if(b)p.set('endDate',b);if(S.search)p.set('search',S.search);
  try{
    const r=await fetch(S.url+'?'+p);
    if(!r.ok)throw new Error('The API returned '+r.status+(r.statusText?' '+r.statusText:'')+'.');
    const j=await r.json();if(my!==seq)return;
    for(const l of j.logs||[]){let P;try{P=JSON.parse(l.properties)}catch{}const e=parseEg(P&&P.EgyptTime);if(e){S.off=Math.round((e.wall-Date.parse(l.timestamp))/6e4)*6e4;break}}
    S.data=j;
  }catch(e){
    if(my!==seq)return;
    S.err=e instanceof TypeError?'Could not reach the API. If you opened this file from disk, the server has to allow cross-origin requests (CORS).':e.message;
  }
  S.loading=false;el('refresh').removeAttribute('aria-busy');render();
}
function sched(){
  clearTimeout(timer);const bar=el('bar');bar.classList.remove('run');
  if(!S.auto)return;
  void bar.offsetWidth;bar.style.animationDuration=S.every+'s';bar.classList.add('run');
  timer=setTimeout(async()=>{if(!document.hidden)await load(true);sched()},S.every*1000);
}

function row(l,i){
  let P=null;try{P=JSON.parse(l.properties)}catch{}
  const k=l.timestamp+'|'+hash(String(l.message)+String(l.properties)),open=S.open.has(k);
  const full=P&&P.SourceContext||'',src=String(full).split('.').pop();
  const props=P&&typeof P==='object'?`<dl class="props">${Object.entries(P).map(([a,v])=>`<dt>${esc(a)}</dt><dd>${vv(v,a)}</dd>`).join('')}</dl>`:(l.properties?`<pre>${esc(l.properties)}</pre>`:'');
  return `<div class="row l-${esc(l.level)}${open?' open':''}" data-k="${esc(k)}">
  <button class="head" aria-expanded="${open}"><span class="no">${esc(l.rowNo)}</span><span class="lvl"><i class="dot"></i>${esc(l.level)}</span>${fmtTime(l,P)}<span class="msg">${msgHtml(l.message,P)}</span>${src?`<span class="src" style="--sc:${srcColor(src)}" title="${esc(full)}">${esc(src)}</span>`:'<span></span>'}<svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
  <div class="body"><div class="inner"><div class="details">
    <pre>${msgHtml(l.message,P)}</pre>
    ${l.exception?`<div><div class="sec x">Exception</div><pre class="err">${excHtml(l.exception)}</pre></div>`:''}
    ${props?`<div><div class="sec">Properties</div>${props}</div>`:''}
    <div class="foot"><span>${esc(l.timestamp)} (UTC)</span><button class="btn" data-i="${i}">Copy as JSON</button></div>
  </div></div></div></div>`;
}

function render(){
  const d=S.data,rows=el('rows');
  el('copyAll').disabled=!(d&&d.logs&&d.logs.length);
  el('arrow').textContent=S.sort==='Desc'?'↓':'↑';
  rows.classList.toggle('busy',S.loading&&!!d);
  if(!d){rows.innerHTML=S.err?`<div class="note">${esc(S.err)}<br><button class="btn" id="retry">Try again</button></div>`:Array(8).fill('<div class="skel"></div>').join('');el('pager').innerHTML='';return}
  el('sub').textContent=`${(d.total||0).toLocaleString()} ${d.total===1?'entry':'entries'}`;
  const banner=S.err?`<div class="banner">${esc(S.err)}</div>`:'';
  rows.innerHTML=banner+(d.logs.length?d.logs.map(row).join(''):`<div class="note">No logs match these filters.<br><button class="btn" id="clear2">Clear filters</button></div>`);
  const t=d.total||0,size=d.count||S.count,pages=Math.max(1,Math.ceil(t/size)),c=S.page;
  const nums=[...new Set([1,pages,c-1,c,c+1])].filter(n=>n>=1&&n<=pages).sort((a,b)=>a-b);
  let btns='',prev=0;for(const n of nums){if(n-prev>1)btns+='<span>…</span>';btns+=`<button data-p="${n}"${n===c?' aria-current="page"':''}>${n}</button>`;prev=n}
  const from=t?(c-1)*size+1:0,to=Math.min(t,c*size);
  el('pager').innerHTML=`<span>Showing ${from.toLocaleString()}–${to.toLocaleString()} of ${t.toLocaleString()}</span>
  <div class="pages"><button data-p="${c-1}" ${c<=1?'disabled':''} aria-label="Previous page">‹</button>${btns}<button data-p="${c+1}" ${c>=pages?'disabled':''} aria-label="Next page">›</button></div>
  <label>Rows <select id="size" class="field">${[10,25,50,100].map(n=>`<option${n===S.count?' selected':''}>${n}</option>`).join('')}</select></label>`;
}
function sync(){
  document.querySelectorAll('[data-tz]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tz===S.tz));
  el('pills').innerHTML=['All',...LV].map(l=>`<button class="pill l-${l}" data-l="${l==='All'?'':l}" aria-pressed="${(l==='All'?'':l)===S.level}">${l==='All'?'':'<i class="dot"></i>'}${l}</button>`).join('');
  el('every').value=S.every;
}
function filt(fn){fn();S.page=1;sync();load()}
function clearAll(){filt(()=>{S.level=S.start=S.end=S.search='';el('q').value=el('from').value=el('to').value=''})}

el('q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>filt(()=>S.search=e.target.value.trim()),350)});
el('from').addEventListener('change',e=>filt(()=>S.start=e.target.value));
el('to').addEventListener('change',e=>filt(()=>S.end=e.target.value));
el('pills').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;const l=b.dataset.l;if(l===S.level&&!l)return;filt(()=>S.level=l===S.level?'':l)});
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>filt(()=>{const n=new Date();S.end='';S.start=toInp(new Date(n-b.dataset.h*36e5));el('from').value=S.start;el('to').value=''}));
el('clear').onclick=clearAll;
el('sortBtn').onclick=()=>filt(()=>S.sort=S.sort==='Desc'?'Asc':'Desc');
document.querySelectorAll('[data-tz]').forEach(b=>b.onclick=()=>{S.tz=b.dataset.tz;ls.set('tz',S.tz);sync();if(S.start||S.end)load();else render()});
el('copyAll').onclick=()=>{const L=S.data&&S.data.logs;if(L&&L.length)copy(JSON.stringify(L.map(logObj),null,2),`Copied ${L.length} ${L.length===1?'log':'logs'}`)};
el('refresh').onclick=()=>{load();sched()};
el('auto').onclick=e=>{S.auto=!S.auto;e.currentTarget.setAttribute('aria-checked',S.auto);sched()};
el('every').onchange=e=>{S.every=+e.target.value;ls.set('every',S.every);sched()};
el('rows').addEventListener('click',e=>{
  const h=e.target.closest('.head');
  if(h){const r=h.parentElement,o=!r.classList.contains('open');if(o&&!S.multi){document.querySelectorAll('#rows .row.open').forEach(x=>setOpen(x,false));S.open.clear()}setOpen(r,o);return}
  const c=e.target.closest('[data-i]');
  if(c){copy(JSON.stringify(logObj(S.data.logs[c.dataset.i]),null,2));return}
  if(e.target.id==='retry')load();if(e.target.id==='clear2')clearAll();
});
el('pager').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b&&!b.disabled){S.page=+b.dataset.p;load();scrollTo({top:0,behavior:'smooth'})}});
el('pager').addEventListener('change',e=>{if(e.target.id==='size'){S.count=+e.target.value;ls.set('count',S.count);S.page=1;load()}});
document.addEventListener('click',e=>{
  if(!S.open.size||e.target.closest('.row,dialog'))return;
  if(String(getSelection()).length)return;
  document.querySelectorAll('#rows .row.open').forEach(x=>setOpen(x,false));S.open.clear();
});
el('cfg').onclick=()=>{el('url').value=S.url;el('key').value=S.key;el('multi').setAttribute('aria-checked',S.multi);el('dlg').showModal()};
el('multi').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true')};
el('close').onclick=()=>el('dlg').close();
el('reset').onclick=()=>{el('url').value=D.url;el('key').value=D.key};
el('save').onclick=()=>{S.url=el('url').value.trim()||D.url;S.key=el('key').value.trim();ls.set('url',S.url);ls.set('key',S.key);S.multi=el('multi').getAttribute('aria-checked')==='true';ls.set('multi',S.multi);if(!S.multi&&S.open.size>1)S.open=new Set([[...S.open].pop()]);el('dlg').close();S.page=1;load()};

sync();load();
</script>
</body>
</html>
